<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Postolache David">
        <meta name="description" content="This is the final project for the HTML course">
        <title>Contact Us &lpar;LTS&rpar;</title>
        <link rel="icon" href="img/favicon.ico" type="image/x-icon">
        <link rel="stylesheet" href="css/style.css" type="text/css">
        <script src="js/main.js" defer></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <header class="header">
            <h1 class="header__h1">Contact Us</h1>
            <nav class="header__nav">
                <ul class="header__ul">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="index.html#ourMenu">Menu</a></li>
                    <li><a href="storeHours.html">Hours</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <figure>
                <img src="img/tacos_close_up_1000x649.png" alt="Tacos close up" width="1000" height="649">
                <figcaption class="offscreen">Little Taco Shop Tacos</figcaption>
            </figure>
        </section>

        <main class="main">
            <article id="ourLocation" class="main__article">
                <h2>Our Location</h2>
                <address>
                    555 Taco Temptation Lane, Suite T<br>
                    Kansas City, MO 55555-5555<br>
                    <br>
                    Phone: <a href="tel:+5555555555">555-555-5555</a>
                </address>
                <br>
            </article>
            <hr>
            <article id="contactForm" class="main__article contact">
                <h2 class="contact__h2">Our Contact Form</h2>
                <form action="https://httpbin.org/post" method="post" class="contact__form">
                    <fieldset class="contact__fieldset">
                        <legend class="offscreen">Send Us A Message</legend>
                        <p class="contact_p">
                            <label class="contact__label" for="name">Name:</label>
                            <input class="contact__input" type="text" name="name" id="name" placeholder="John Doe" required autofocus>
                        </p>
                        <p class="contact_p">
                            <label class="contact__label" for="mail">E-mail:</label>
                            <input class="contact__input" type="email" name="mail" id="mail" placeholder="ex.: johndoe@email.com" required>
                        </p>
                        <p class="contact_p">
                            <label class="contact__label" for="message">Your Message:</label>
                            <br>
                            <textarea class="contact__textarea" name="message" id="message" cols="30" rows="10" placeholder="Type your message here"></textarea>
                        </p>
                    </fieldset>
                    <br>
                    <button class="contact__button" type="submit" formaction="https://httpbin.org/post" formmethod="post">Submit</button>
                    <button class="contact__button" type="reset">Reset</button>
                </form>
            </article>
            
        </main>
        <hr>
        <footer class="footer">
            <p>
                <span class="nowrap">Copyright &copy; <time id="year"></time></span>
                <span class="nowrap">The Little Taco Shop</span>
            </p>
        </footer>
    </body>
</html>
